---
version: 0.1
runson: win

autosplit: true
concurrency: 1

runtime:
  language: java
  version: 11

env: 
  TOKEN: anvdegtod-asdaasda0asda-asda
  ENVIRONMENT: staging for Task 2

pre:
  - echo %ENVIRONMENT%
  - mvn -Dmaven.repo.local=./.m2 dependency:resolve

testDiscovery:
  type: raw
  mode: dynamic
  command: grep 'test name' xml/testng_win.xml | awk '{print$2}' | sed 's/name=//g' | sed 's/\x3e//g'

testRunnerCommand: mvn test `-Dplatname=win `-Dmaven.repo.local=./.m2 dependency:resolve `-DselectedTests=$test  #Unnecessary apostrophes in the maven command.

retryOnFailure: true
maxRetries: 1

jobLabel: [selenium-testng, win, v1, autosplit]